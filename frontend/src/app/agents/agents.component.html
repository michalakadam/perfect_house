<div class="component-container">
  <header>
    <h2 class="title">Ludzie</h2>
  </header>
  <div class="list-of-agents">
    @for (
      agent of agentsStateManager.agents$ | async;
      track trackById($index, agent)
    ) {
      <perfect-agent-brief
        vertical
        [agent]="agent"
        (click)="agentsStateManager.openAgentPage(agent.fullName)"
      >
      </perfect-agent-brief>
    }
  </div>
</div>
